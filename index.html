<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Aura</title>
  <meta name="description" content="Webcam hand tracking with five modes: system cursor control, a hand physics playground, a slicing game, air painting, and an interactive lesson on how the tracking works." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <video id="webcam" autoplay muted playsinline></video>
    <div id="scrim" aria-hidden="true"></div>
    <canvas id="overlay"></canvas>
  </div>

  <div class="grain-layer" aria-hidden="true"></div>

  <!-- Telemetry -->
  <div id="hud" role="status" aria-live="polite">
    <div class="hud-title">
      <span class="hud-dot"></span>
      <span class="hud-name">HAND AURA</span>
      <span class="hud-badge" id="hud-mode">PHYSICS</span>
    </div>

    <div class="hud-grid">
      <div class="hud-cell">
        <div class="hud-label">Hands</div>
        <div class="hud-value" id="hud-hands">0</div>
      </div>
      <div class="hud-cell">
        <div class="hud-label">Confidence</div>
        <div class="hud-value" id="hud-conf">0%</div>
      </div>
      <div class="hud-cell">
        <div class="hud-label">FPS</div>
        <div class="hud-value" id="hud-fps">0</div>
      </div>
      <div class="hud-cell">
        <div class="hud-label">Gesture</div>
        <div class="hud-value small" id="hud-gesture">NONE</div>
      </div>
    </div>

    <div class="hud-bar-row">
      <span class="hud-label">Signal</span>
      <div class="hud-bar-track">
        <div class="hud-bar-fill" id="hud-signal"></div>
      </div>
    </div>
  </div>

  <!-- Top right controls -->
  <div id="topright">
    <div id="themebar" role="group" aria-label="Theme"></div>
    <button id="help-open" title="Controls (H)" aria-label="Show controls">?</button>
  </div>

  <!-- Mode switcher, filled in by app.js -->
  <nav id="modebar" aria-label="Modes"></nav>

  <aside id="help">
    <button id="help-close" aria-label="Close controls">Close</button>
    <div id="help-body"></div>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="loading-screen">
    <div class="ls-content">
      <div class="ls-spinner"></div>
      <div class="ls-title">Hand Aura</div>
      <div class="ls-sub" id="ls-message">Requesting camera access</div>
    </div>
  </div>

  <!-- MediaPipe globals, loaded before the module so app.js can see them -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
